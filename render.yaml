services:
  - type: web
    name: atelier-booking-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: MINIAPP_URL
        sync: false
      - key: MASTER_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-db
          property: connectionString

databases:
  - name: atelier-db
    plan: free
