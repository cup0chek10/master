services:
  - type: web
    name: atelier-booking-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 22.14.0
      - key: BOT_TOKEN
        sync: false
      - key: MINIAPP_URL
        sync: false
      - key: MASTER_TELEGRAM_ID
        sync: false
      - key: BOT_POLLING_ENABLED
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-db
          property: connectionString

databases:
  - name: atelier-db
    plan: free
